name: Release Plugins

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout FilaMan test runtime
        uses: actions/checkout@v4
        with:
          repository: Fire-Devils/filaman-system
          ref: 5fef37dabb9b167453ae09d27f242b519c6b0133
          path: .filaman-system

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .filaman-system/backend/pyproject.toml

      - name: Install test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".filaman-system/backend[dev]" "bambulabs_api>=2.6.0"

      - name: Test Bambu driver against FilaMan
        env:
          PYTHONPATH: .filaman-system/backend:.
        run: python -m unittest discover -s tests -p 'test_driver.py' -v

      - name: Test release notes generator
        run: python -m unittest discover -s tests -p 'test_release_notes.py' -v

  release:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and release plugins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Plugin folder names in this repository contain no whitespace.
          # shellcheck disable=SC2044
          for PLUGIN_JSON in $(find . -maxdepth 2 -name "plugin.json" -not -path "./.git/*"); do
            PLUGIN_DIR=$(dirname "$PLUGIN_JSON")
            FOLDER_NAME=$(basename "$PLUGIN_DIR")
            VERSION=$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' "$PLUGIN_JSON" | head -1 | sed 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/')

            if [ -z "$VERSION" ]; then
              echo "⚠️  Keine Version in $PLUGIN_JSON, überspringe."
              continue
            fi

            TAG="${FOLDER_NAME}-v${VERSION}"
            ZIP_NAME="${FOLDER_NAME}-${VERSION}.zip"

            # Prüfen ob Release bereits existiert
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "⚠️  Release $TAG existiert bereits. Überspringe."
              continue
            fi

            echo "📦 Erstelle $ZIP_NAME ..."
            zip -r "$ZIP_NAME" "$FOLDER_NAME" -x "$FOLDER_NAME/__pycache__/*" "$FOLDER_NAME/*.pyc"

            # Release-Notes aus Conventional Commits zusammenbauen und den
            # Versionssprung gegen die Änderungen seit dem letzten Tag prüfen.
            DESCRIPTION=$(grep -o '"description"[[:space:]]*:[[:space:]]*"[^"]*"' "$PLUGIN_JSON" | head -1 | sed 's/.*"description"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/')
            python scripts/generate_release_notes.py \
              --plugin "$FOLDER_NAME" \
              --version "$VERSION" \
              --target HEAD \
              --repository-url "${{ github.server_url }}/${{ github.repository }}" \
              --description "$DESCRIPTION" \
              --path "$PLUGIN_DIR" \
              --path README.md \
              --output /tmp/release_notes.md

            echo "📤 Erstelle GitHub Release $TAG ..."
            gh release create "$TAG" "$ZIP_NAME" \
              --title "$FOLDER_NAME $VERSION" \
              --notes-file /tmp/release_notes.md \
              --latest=false

            echo "✅ Release $TAG mit $ZIP_NAME erstellt."
          done

          echo "🎉 Fertig!"
